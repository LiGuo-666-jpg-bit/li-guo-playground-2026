<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII 编码器 / 解码器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #313244;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #89b4fa;
            margin-top: 0;
            border-bottom: 2px solid #45475a;
            padding-bottom: 15px;
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #a6adc8;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45475a;
            background: #1e1e2e;
            color: #cdd6f4;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            box-sizing: border-box;
            min-height: 80px;
        }
        textarea:focus {
            outline: 2px solid #89b4fa;
            border-color: transparent;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            background: #45475a;
            color: #cdd6f4;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1 0 auto;
        }
        button:hover {
            background: #585b70;
            transform: translateY(-2px);
        }
        button.primary {
            background: #89b4fa;
            color: #1e1e2e;
        }
        button.primary:hover {
            background: #74c7ec;
        }
        button.success {
            background: #a6e3a1;
            color: #1e1e2e;
        }
        button.success:hover {
            background: #94e2d0;
        }
        button.warning {
            background: #f9e2af;
            color: #1e1e2e;
        }
        button.warning:hover {
            background: #fab387;
        }
        .hint {
            font-size: 14px;
            color: #a6adc8;
            background: #1e1e2e;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #89b4fa;
        }
        .hint code {
            background: #45475a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #f9e2af;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6c7086;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 ASCII 编码器 / 解码器</h1>

        <!-- 输入区 -->
        <div class="section">
            <label for="inputText">📝 输入文本或 ASCII 码（空格或逗号分隔）</label>
            <textarea id="inputText" placeholder="例如：Hello 世界 或 72 101 108 108 111">Hello 世界</textarea>
        </div>

        <!-- 按钮区 -->
        <div class="btn-group">
            <button class="primary" onclick="encodeDecimal()">⬆ 编码为十进制 (ASCII码)</button>
            <button class="primary" onclick="encodeHex()">⬆ 编码为十六进制 (Hex)</button>
            <button class="primary" onclick="encodeBinary()">⬆ 编码为二进制 (Bin)</button>
            <button class="success" onclick="decodeToText()">⬇ 解码为文本</button>
            <button class="warning" onclick="clearAll()">🗑 清空</button>
        </div>

        <!-- 输出区 -->
        <div class="section">
            <label for="outputText">📋 转换结果</label>
            <textarea id="outputText" placeholder="结果将显示在这里..." readonly></textarea>
        </div>

        <!-- 提示 -->
        <div class="hint">
            💡 <strong>小贴士：</strong><br>
            • <strong>编码</strong>：将文本（包括中文）转为 ASCII 码（中文会显示 Unicode 码点）。<br>
            • <strong>解码</strong>：输入数字（如 <code>72 101 108 108 111</code>）点“解码为文本”即可还原。<br>
            • 支持十进制、十六进制（带 <code>0x</code> 或不带）和二进制（带 <code>0b</code> 或不带）混合输入。
        </div>
        <div class="footer">Made with ❤️ 纯前端，数据不会上传到服务器</div>
    </div>

    <script>
        // 获取输入输出元素
        const inputEl = document.getElementById('inputText');
        const outputEl = document.getElementById('outputText');

        // ----- 编码函数 -----
        function encodeDecimal() {
            const text = inputEl.value;
            let result = [];
            for (let i = 0; i < text.length; i++) {
                result.push(text.charCodeAt(i));
            }
            outputEl.value = result.join(' ');
        }

        function encodeHex() {
            const text = inputEl.value;
            let result = [];
            for (let i = 0; i < text.length; i++) {
                let hex = text.charCodeAt(i).toString(16).toUpperCase();
                // 补齐两位（便于阅读，但非必须）
                if (hex.length < 2) hex = '0' + hex;
                result.push('0x' + hex);
            }
            outputEl.value = result.join(' ');
        }

        function encodeBinary() {
            const text = inputEl.value;
            let result = [];
            for (let i = 0; i < text.length; i++) {
                let bin = text.charCodeAt(i).toString(2);
                // 补齐为8位（标准ASCII字节）
                while (bin.length < 8) bin = '0' + bin;
                result.push('0b' + bin);
            }
            outputEl.value = result.join(' ');
        }

        // ----- 解码函数（智能识别十进制、十六进制、二进制） -----
        function decodeToText() {
            const raw = inputEl.value.trim();
            if (!raw) {
                outputEl.value = '⚠️ 请输入要解码的 ASCII 码（数字）';
                return;
            }

            // 用正则拆分：按空格、逗号、中文逗号、换行等分割
            const tokens = raw.split(/[\s,，、\n]+/).filter(t => t.length > 0);
            let result = [];

            for (let token of tokens) {
                let num = null;
                // 1. 尝试作为十六进制（带 0x 或 0X）
                if (/^0x[0-9a-fA-F]+$/.test(token)) {
                    num = parseInt(token, 16);
                }
                // 2. 尝试作为二进制（带 0b 或 0B）
                else if (/^0b[01]+$/.test(token)) {
                    num = parseInt(token, 2);
                }
                // 3. 尝试作为普通十进制数字
                else if (/^-?\d+$/.test(token)) {
                    num = parseInt(token, 10);
                }
                // 4. 尝试作为无前缀十六进制（如 FF 或 A1）
                else if (/^[0-9a-fA-F]+$/.test(token) && token.length > 1) {
                    // 但为了避免误判（比如纯数字 "123" 前面已经处理过了），这里只处理含字母的十六进制
                    if (/[a-fA-F]/.test(token)) {
                        num = parseInt(token, 16);
                    }
                }

                if (num !== null && !isNaN(num) && num >= 0 && num <= 0x10FFFF) {
                    // 合法 Unicode 码点
                    result.push(String.fromCodePoint(num));
                } else {
                    // 如果无法识别，保留原样并加 [？] 标记
                    result.push('[?' + token + '?]');
                }
            }

            outputEl.value = result.join('');
        }

        // ----- 清空 -----
        function clearAll() {
            inputEl.value = '';
            outputEl.value = '';
        }

        // ----- 额外：回车键快捷操作（在输入框按 Ctrl+Enter 执行解码）-----
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                decodeToText();
            }
        });

        // 页面加载时自动演示一次
        window.onload = function() {
            // 默认 Hello 世界
            encodeDecimal();
        };
    </script>
</body>
</html>
